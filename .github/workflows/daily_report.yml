name: 每日早报

# ---------------------------------------------------------------------------
# 触发方式
#   workflow_dispatch: 唯一入口。由外部定时器（cron-job.org）每天 07:30（北京）
#                      POST 一次 GitHub 的 dispatch 接口来触发。
#                      手动在 Actions 页面点 "Run workflow" 也是走这条路。
#                      可勾选 dry-run 只验证链路，不调用 AI / 不推送 / 不提交。
#
# 【为什么删掉了 schedule】
# GitHub 的 schedule 触发器是 best-effort 语义，实测延迟如下（全部为北京时间）：
#
#   cron 表达式      期望触发      实际触发            延迟
#   ---------------  ------------  ------------------  --------
#   0 0 * * *        08:00         09-15 12:15         4h15m
#   0 0 * * *        08:00         09-16 12:11         4h11m
#   37 23 * * *      07:37         09-17 09:39         2h02m
#
# 换成非整点的分钟只是把 4 小时压到 2 小时，仍然完全不可用。
# 另外每次运行的 run_started_at 都等于 created_at（排队 0 分钟），说明这段延迟
# 全部发生在 GitHub 调度器内部、连运行实例都还没创建——调 concurrency、
# 换 runner、加 timeout 都救不了，只能绕开 schedule 这个触发器本身。
#
# 对照数据：同一仓库的 workflow_dispatch 运行，created → started 全部是 0.0 分钟。
# 即"外部打接口"这条路是秒级响应的。
#
# 【代价与对策】
# 定时责任转移到外部服务后，这个工作流不再被 GitHub 自动调度。顺带的好处是
# 也绕开了"仓库 60 天无提交则自动停用定时工作流"的限制。
# 外部定时器的完整配置见 README「外部定时器（cron-job.org）配置白皮书」。
#
# 防重复：外部定时器可能重复触发（Test Run / 重试 / 手动 Re-run），
# 重复触发由 main.py 的幂等闸门挡住——当天已出过正式早报则跳过，
# 不再发邮件、不再调 DeepSeek。需要强制重出时用 --force。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run：跳过 DeepSeek 与邮件推送，仅验证采集与渲染"
        type: boolean
        default: false
      force:
        description: "force：忽略「今天已出过」的幂等闸门，强制重出一期（会再发一封邮件）"
        type: boolean
        default: false

# 部署到 gh-pages 分支需要写权限；同时为 GitHub Pages 与 OIDC 预留权限
permissions:
  contents: write
  pages: write
  id-token: write

# 避免定时任务与手动任务并发写同一个分支
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 采集 → 提炼 → 渲染 → 推送 → 部署
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 记录触发信息
        run: |
          # 定时责任已经交给外部定时器，"期望时间"不再是 cron 表达式，而是
          # cron-job.org 上配置的那个时刻（默认北京时间 07:30）。
          #
          # 注意：这个偏差只能当参考。手动 Re-run、点 cron-job.org 的 Test Run
          # 都会让偏差变大，那是人主动触发的，不代表定时器不准。
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          CST = timezone(timedelta(hours=8))
          TARGET_HOUR, TARGET_MINUTE = 7, 30          # 与 cron-job.org 上的配置保持一致
          TARGET_LABEL = f"{TARGET_HOUR:02d}:{TARGET_MINUTE:02d}"

          now_utc = datetime.now(timezone.utc)
          now_cst = now_utc.astimezone(CST)
          event = os.environ.get("GITHUB_EVENT_NAME", "?")

          print(f"事件类型    : {event}")
          print(f"触发者      : {os.environ.get('GITHUB_ACTOR', '?')}")
          print(f"引用        : {os.environ.get('GITHUB_REF_NAME', '?')}")
          print(f"实际触发 UTC: {now_utc:%Y-%m-%d %H:%M:%S}")
          print(f"实际触发北京: {now_cst:%Y-%m-%d %H:%M:%S}")
          print(f"外部定时目标: {TARGET_LABEL}（北京）")

          if event != "schedule":
              print("由外部定时器 / 手动触发，不做延迟判定（该指标只对内置 schedule 有意义）")
              raise SystemExit(0)

          expected = now_cst.replace(hour=TARGET_HOUR, minute=TARGET_MINUTE, second=0, microsecond=0)
          if expected > now_cst:
              expected -= timedelta(days=1)

          delay = (now_cst - expected).total_seconds() / 60
          print(f"调度延迟    : {delay:.0f} 分钟")

          if delay > 120:
              print(f"::warning::调度延迟 {delay:.0f} 分钟，GitHub 调度器明显推迟了本次任务")
          elif delay > 30:
              print(f"::notice::调度延迟 {delay:.0f} 分钟")
          PY

      - name: 生成早报
        id: generate
        env:
          # ---- 密钥（在 Settings → Secrets and variables → Actions 中配置）----
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # ---- 邮件推送（QQ 邮箱 SMTP）----
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}

          # ---- GitHub ----
          # 必须显式传入，fetcher 依赖它突破 Search API 匿名限流（10/分钟 → 30/分钟）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ---- 可选 ----
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry-run 模式运行"
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::notice::force 模式运行：忽略当日幂等闸门"
            ARGS="$ARGS --force"
          fi
          python main.py $ARGS

      - name: 写入 Actions 摘要
        if: always()
        run: |
          {
            echo "## 每日早报生成结果"
            echo ""
            echo "- 运行模式：\`${{ github.event.inputs.dry_run == 'true' && 'dry-run' || 'production' }}\`"
            echo "- 强制重出：\`${{ github.event.inputs.force == 'true' && '是（已忽略当日幂等闸门）' || '否' }}\`"
            echo "- 产物文件：\`dist/index.html\` + \`obsidian/<日期>.md\`"
            echo "- 产物文件：\`dist/index.html\`"
            echo "- 站点地址：${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

      - name: 保存往期存档与 Obsidian 笔记到仓库
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          # Actions 每次运行都是全新的干净检出，往期存档必须提交回仓库才能累积。
          # 否则第二天运行时 archive/ 是空的，历史记录每天都会归零。
          # obsidian/ 同理：它是给 Obsidian 库用的笔记，也必须在仓库里长期累积。
          if [ ! -d archive ] && [ ! -d obsidian ]; then
            echo "::warning::archive/ 与 obsidian/ 都不存在，跳过"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 两个目录都存在时才分别 add。
          # 这里用 if 而不是 "[ -d x ] && git add x"：后者在目录缺失时整条命令返回非零，
          # 叠加 set -e 容易踩坑，写成 if 语义明确。
          if [ -d archive ]; then
            git add archive
          fi
          if [ -d obsidian ]; then
            git add obsidian
          fi

          if git diff --staged --quiet; then
            echo "往期存档无变化，跳过提交"
            exit 0
          fi

          # [skip ci] 防止这次提交再次触发本工作流形成死循环
          git commit -m "chore: 保存往期存档与 Obsidian 笔记 $(TZ=Asia/Shanghai date +%F) [skip ci]"

          # checkout 可能处于 detached HEAD，显式推回目标分支
          git push origin "HEAD:${{ github.ref_name }}"
          echo "::notice::往期存档与 Obsidian 笔记已提交到 ${{ github.ref_name }}"

      - name: 部署到 gh-pages 分支
        if: success() && github.event.inputs.dry_run != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          # 每次全量覆盖；往期页面已在渲染阶段由 archive/*.json 全部重新生成
          keep_files: false
          force_orphan: true
          # _raw.json 是调试快照，只进 Actions 产物用于排查，不发布到公开站点
          exclude_assets: "_raw.json"
          commit_message: "chore: 更新每日早报 ${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: 失败时告警
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "::warning::未配置 SMTP_USER / SMTP_PASS，跳过失败告警邮件"
            exit 0
          fi
          python - <<'PY'
          import os
          import smtplib
          from email.header import Header
          from email.mime.text import MIMEText
          from email.utils import formataddr

          user = os.environ["SMTP_USER"]
          passwd = os.environ["SMTP_PASS"]
          to = os.environ.get("RECEIVER_EMAIL") or user
          run_url = os.environ.get("RUN_URL", "")
          run_number = os.environ.get("RUN_NUMBER", "?")

          body = "\n".join([
              "每日早报生成失败。",
              "",
              f"运行编号：{run_number}",
              f"日志详情：{run_url}",
              "",
              "常见原因：",
              "  1. DEEPSEEK_API_KEY 额度耗尽或失效",
              "  2. GITHUB_TOKEN 过期（重新生成并更新 Secret）",
              "  3. SMTP_PASS 填成了登录密码而非授权码",
              "  4. 上游信息源大面积不可达（日志里搜「RSS 源失败」）",
          ])

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header(f"[失败] 每日早报 · 运行 {run_number}", "utf-8")
          msg["From"] = formataddr(("每日早报", user))
          msg["To"] = to

          try:
              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as server:
                  server.login(user, passwd)
                  server.sendmail(user, [to], msg.as_string())
              print("告警邮件已发送")
          except Exception as exc:
              print(f"告警邮件发送失败: {exc}")
          PY
